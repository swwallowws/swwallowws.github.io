name: Pages

# Builds the site, walks every page in a real Chrome (scripts/check-site.mjs:
# Paper and Night, every framed demo, every link within the site), and only then
# publishes it to GitHub Pages, on every push to main.
# Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the deploy job may publish. The build runs npm packages (and a pull request's
# code), so it gets read access and nothing else.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Every page works in Chrome (the runner's own)
        run: |
          npx vite preview --port 4180 --strictPort &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4180/ && break; sleep 1; done
          npm run check:site -- http://localhost:4180/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
