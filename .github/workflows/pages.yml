name: Pages

# Builds the site, walks every page in a real Chrome (scripts/check-site.mjs:
# Paper and Night, every framed demo, every link within the site), and only then
# publishes it to GitHub Pages, on every push to main.
# Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Every page works in Chrome (the runner's own)
        run: |
          npx vite preview --port 4180 --strictPort &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:4180/ && break; sleep 1; done
          npm run check:site -- http://localhost:4180/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
