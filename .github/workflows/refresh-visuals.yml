name: Refresh pictures

# Every few hours: re-record the loops and README stills of any product whose live
# site changed since its picture, and propose them as pull requests on the product's
# repo (media/) and on this one (visuals/sources.json). Recipes CI can't record are
# listed in the log for a person (scripts/refresh-visuals.mjs). Also keeps the
# showcase's copy of YSAD's demo current (job ysad-demo). Needs the VISUALS_PR_TOKEN
# secret (Contents and Pull requests write on the product repos and this one,
# Contents read on you-suck-at-drums).
#
# The token never shares a job with an npm package: record installs and runs them with
# no token, then hands its pictures to propose, which installs nothing and checks the
# hand-off before it pushes anything (scripts/refresh-visuals.mjs, readHandoff). A
# leaked token could push to the product repos, and a pushed branch runs their CI.
# Actions are pinned to commits for the same reason.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-visuals

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg, for encoding the loops
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Re-record what changed
        run: node scripts/refresh-visuals.mjs --record "$RUNNER_TEMP/handoff"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoff
          path: ${{ runner.temp }}/handoff
          retention-days: 1

  propose:
    needs: record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: handoff
          path: ${{ runner.temp }}/handoff
      # No npm ci here: the script loads only Node's own modules (a test holds that).
      - name: Propose what was re-recorded
        env:
          VISUALS_PR_TOKEN: ${{ secrets.VISUALS_PR_TOKEN }}
        run: node scripts/refresh-visuals.mjs --propose "$RUNNER_TEMP/handoff"

  # YSAD's repo is private, so the showcase carries a copy of its demo
  # (public/demos/ysad, scripts/ysad-demo.sh). When the demo changed, propose the
  # new copy as a pull request. The token needs Contents read on you-suck-at-drums.
  ysad-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch YSAD's demo
        env:
          TOKEN: ${{ secrets.VISUALS_PR_TOKEN }}
        run: git clone --quiet --depth 1 "https://x-access-token:${TOKEN}@github.com/swwallowws/you-suck-at-drums.git" ../ysad
      - name: Copy it in
        run: bash scripts/ysad-demo.sh ../ysad
      - name: Propose it, if it changed
        env:
          GH_TOKEN: ${{ secrets.VISUALS_PR_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain public/demos/ysad)" ]; then echo "YSAD's demo copy is current"; exit 0; fi
          rev="$(git -C ../ysad rev-parse --short HEAD)"
          branch="ysad-demo/$rev"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then echo "$branch already proposed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git add -A public/demos/ysad
          git commit -q -m "YSAD demo: you-suck-at-drums $rev"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/swwallowws/swwallowws.github.io.git" "$branch"
          gh pr create --repo swwallowws/swwallowws.github.io --head "$branch" --base main \
            --title "YSAD demo: you-suck-at-drums $rev" \
            --body "YSAD's demo changed in its private repo, so this updates the showcase's copy (public/demos/ysad). Try it on the preview, then merge. Proposed by the Refresh pictures workflow."
